apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.nanocd.ozyria.fr
spec:
  group: nanocd.ozyria.fr
  scope: Namespaced
  names:
    kind: Application
    singular: application
    plural: applications
    shortNames:
      - app
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.syncStatus
        - name: Commit
          type: string
          jsonPath: .status.lastSyncedCommit
        - name: Last Sync
          type: date
          jsonPath: .status.lastSyncTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [repo, source]
              properties:
                repo:
                  type: string
                branch:
                  type: string
                  default: main
                authSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                source:
                  type: object
                  required: [type, path]
                  properties:
                    type:
                      type: string
                      enum: [raw]
                    path:
                      type: string
                sync:
                  type: object
                  default: {}
                  properties:
                    interval:
                      type: string
                      pattern: '^[0-9]+(s|m|h)$'
                      default: 60s
                    paused:
                      type: boolean
                      default: false
                prune:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                lastObservedGeneration:
                  type: number
                syncStatus:
                  type: string
                  enum: [Synced, OutOfSync, Syncing]
                lastSyncedCommit:
                  type: string
                lastSyncTime:
                  type: string
                  format: date-time
